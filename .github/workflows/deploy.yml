name: Deploy Portfolio to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build React app
      run: npm run build
      env:
        CI: false
    
    - name: Deploy to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "dist/"
        target: "/home/ubuntu/portfolio/"
        strip_components: 1
        rm: true
    
    - name: Set Permissions and Restart Nginx
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo chmod 755 /home/ubuntu
          sudo chmod -R 755 /home/ubuntu/portfolio
          sudo systemctl restart nginx
          echo "✅ Deployment successful!"
          echo "🌐 Site live at: http://${{ secrets.EC2_HOST }}"
