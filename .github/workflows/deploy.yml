name: Deploy with Docker to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to EC2 with Docker
      env:
        SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
      run: |
        echo "$SSH_KEY" > key.pem
        chmod 600 key.pem
        
        ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@$HOST "mkdir -p ~/portfolio"
        scp -o StrictHostKeyChecking=no -i key.pem -r ./* ubuntu@$HOST:~/portfolio/
        
        ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@$HOST "
          cd ~/portfolio &&
          docker-compose down 2>/dev/null || true &&
          docker-compose build --no-cache &&
          docker-compose up -d &&
          echo '✅ Docker container is running!' &&
          docker ps
        "
        
        echo "🚀 Deployed to http://$HOST"
