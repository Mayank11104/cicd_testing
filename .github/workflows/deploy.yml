name: Deploy Portfolio to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build React app
      run: npm run build
      env:
        CI: false
    
    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOSTNAME: ${{ secrets.EC2_HOST }}
        USER_NAME: ubuntu
      run: |
        echo "$PRIVATE_KEY" > private_key && chmod 600 private_key
        ssh -o StrictHostKeyChecking=no -i private_key ${USER_NAME}@${HOSTNAME} '
          mkdir -p /home/ubuntu/portfolio/dist
        '
        scp -o StrictHostKeyChecking=no -i private_key -r dist/* ${USER_NAME}@${HOSTNAME}:/home/ubuntu/portfolio/dist/
        ssh -o StrictHostKeyChecking=no -i private_key ${USER_NAME}@${HOSTNAME} '
          sudo systemctl restart nginx
          echo "Deployment successful!"
        '
        
    - name: Deployment Success
      run: |
        echo "✅ Deployment successful!"
        echo "🌐 Your site is live at: http://${{ secrets.EC2_HOST }}"
